# Production compose — used by deploy.sh via COMPOSE_FILE=docker-compose.prod.yml
#
# Services: backend (compiled), nginx (contains the built frontend), db
# Excluded vs dev: no frontend dev server, no db_test, no code volumes, no debug port
# deploy.sh rebuilds only the images affected by changes since the last deploy

services:
  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: myapp_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    container_name: myapp_backend
    restart: always
    # No external port binding — nginx reaches backend via Docker network (backend:5001)
    # Binding 5001 to the host would expose the API directly to the internet
    # CI selects the backend test env; production defaults to the root .env.
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - UPLOAD_ROOT=/app/uploads
    volumes:
      - homepage_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  db:
    image: postgres:18-alpine
    container_name: myapp_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # No external port binding — backend reaches db via Docker network (db:5432)
    # Binding 5432 to the host would expose PostgreSQL to the internet
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
  homepage_uploads:  # Shared app uploads; legacy volume name retained to preserve existing files
