name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge_path:
    name: Enforce develop → main only
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify release source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "PRs to main must come from develop, not '$HEAD_REF'."
            exit 1
          fi

  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      static: ${{ steps.plan.outputs.static }}
      backend: ${{ steps.plan.outputs.backend }}
      backend_mode: ${{ steps.plan.outputs.backend_mode }}
      backend_changed_paths: ${{ steps.plan.outputs.backend_changed_paths }}
      frontend: ${{ steps.plan.outputs.frontend }}
      frontend_mode: ${{ steps.plan.outputs.frontend_mode }}
      deploy: ${{ steps.plan.outputs.deploy }}
      backend_image: ${{ steps.plan.outputs.backend_image }}
      frontend_image: ${{ steps.plan.outputs.frontend_image }}
      compose: ${{ steps.plan.outputs.compose }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Plan checks from changed ownership paths
        id: plan
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=ACDMR "$BASE_SHA"...HEAD \
            | node scripts/ci/select-tests.ts --github-output "$GITHUB_OUTPUT" --base-ref "$BASE_REF"

  quality:
    name: Lint & Shell Analysis
    needs: changes
    if: github.base_ref != 'main' && needs.changes.outputs.static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install quality dependencies
        run: npm ci

      - name: Run static checks
        run: bash scripts/tests/test-static.sh

      - name: Check changed repository patterns
        env:
          CHECK_PATTERNS_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/patterns/run-pattern-checks.ts --changed

      - name: Test deployment planning
        if: needs.changes.outputs.deploy == 'true'
        run: bash scripts/tests/test-deploy.sh

  backend:
    name: Backend — Typecheck, Migrate & Test
    needs: changes
    if: github.base_ref != 'main' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: myapp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Select PostgreSQL 18 clients for database worker tests
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-18
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"

      - name: Type check
        working-directory: backend
        run: npm run typecheck

      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/myapp_test
        run: npm run db:migrate

      - name: Validate migration checksums
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/myapp_test
        run: npm run db:status

      - name: Verify generated database types are committed
        run: git diff --exit-code -- backend/src/types/database.ts

      - name: Run tests
        working-directory: backend
        env:
          BACKEND_MODE: ${{ needs.changes.outputs.backend_mode }}
          BACKEND_CHANGED_PATHS: ${{ needs.changes.outputs.backend_changed_paths }}
          DATABASE_URL: postgresql://test:test@localhost:5432/myapp_test
          JWT_SECRET: ci-test-secret
          REFRESH_SECRET: ci-test-refresh-secret
          EMAIL_USER: test@example.com
          EMAIL_PASS: test
          EMAIL_FROM: test@example.com
          NODE_ENV: test
        run: |
          if [ "$BACKEND_MODE" = full ]; then
            npm test
          else
            read -r -a changed_paths <<< "$BACKEND_CHANGED_PATHS"
            for changed_path in "${changed_paths[@]}"; do
              if [ ! -f "$changed_path" ]; then
                BACKEND_MODE=full
                break
              fi
            done

            if [ "$BACKEND_MODE" = full ]; then
              npm test -- --runInBand
            else
              npm test -- --runInBand --findRelatedTests "${changed_paths[@]}"
            fi
          fi

      - name: Build
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend — Typecheck & Build
    needs: changes
    if: github.base_ref != 'main' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run related tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FRONTEND_MODE: ${{ needs.changes.outputs.frontend_mode }}
        run: |
          if [ "$FRONTEND_MODE" = full ]; then
            cd frontend
            npm test
          else
            cd frontend
            npm test -- --changed "$BASE_SHA"
          fi

      - name: Build (includes tsc)
        working-directory: frontend
        run: npm run build

  production-compose:
    name: Production Compose Validation
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate production Compose configuration
        env:
          BACKEND_ENV_FILE: backend/.env.test
          DB_USER: test
          DB_PASSWORD: test
          DB_NAME: myapp_test
        run: docker compose -f docker-compose.prod.yml config --quiet

  production-backend-image:
    name: Backend Production Image
    needs: changes
    if: needs.changes.outputs.backend_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build backend production image
        run: docker build -f backend/Dockerfile --target prod .

  production-frontend-image:
    name: Frontend Production Image
    needs: changes
    if: needs.changes.outputs.frontend_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build frontend/nginx production image
        run: docker build -f frontend/Dockerfile --tag be-original-frontend-ci .

      - name: Validate production nginx configuration
        run: |
          mkdir -p "$RUNNER_TEMP/letsencrypt/live/be-original.ca"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj /CN=be-original.ca \
            -keyout "$RUNNER_TEMP/letsencrypt/live/be-original.ca/privkey.pem" \
            -out "$RUNNER_TEMP/letsencrypt/live/be-original.ca/fullchain.pem"
          docker run --rm \
            --add-host backend:127.0.0.1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/nginx.conf,target=/etc/nginx/conf.d/default.conf,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/letsencrypt,target=/etc/letsencrypt,readonly" \
            be-original-frontend-ci nginx -t
