name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce-merge-path:
    name: Enforce develop → main only
    runs-on: ubuntu-latest
    steps:
      - name: Block non-develop PRs targeting main
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'develop'
        run: |
          echo "PRs to main must come from develop, not '${{ github.head_ref }}'."
          exit 1

  backend:
    name: Backend — Typecheck, Migrate & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: myapp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Type check
        working-directory: backend
        run: npm run typecheck

      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/myapp_test
        run: npm run db:migrate

      - name: Validate migration checksums
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/myapp_test
        run: npm run db:status

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/myapp_test
          JWT_SECRET: ci-test-secret
          REFRESH_SECRET: ci-test-refresh-secret
          EMAIL_USER: test@example.com
          EMAIL_PASS: test
          EMAIL_FROM: test@example.com
          NODE_ENV: test
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend — Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build (includes tsc)
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Only deploy on direct push to main (not on PRs targeting main)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        run: |
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}" \
            "cd '${{ secrets.LIGHTSAIL_APP_PATH }}' && \
              if git status --porcelain | grep -q .; then \
                echo 'ERROR: Server working tree has uncommitted changes'; \
                git status --short; \
                exit 1; \
              fi; \
              git fetch origin main && \
              git reset --hard origin/main && \
              ./scripts/deploy.sh"
          rm -f /tmp/deploy_key
