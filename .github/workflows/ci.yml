name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enforce-merge-path:
    name: Enforce develop → main only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block non-develop PRs targeting main
        if: github.base_ref == 'main' && github.head_ref != 'develop'
        run: |
          echo "PRs to main must come from develop, not '${{ github.head_ref }}'."
          exit 1

  changes:
    name: Classify production changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend_image: ${{ steps.production.outputs.backend_image }}
      frontend_image: ${{ steps.production.outputs.frontend_image }}
      compose: ${{ steps.production.outputs.compose }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect production build inputs
        id: production
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$BASE_REF" = main ]; then
            backend_image=true
            frontend_image=true
            compose=true
          else
            backend_image=false
            frontend_image=false
            compose=false

            if ! git diff --quiet "$BASE_SHA" HEAD -- \
              backend/Dockerfile backend/.dockerignore backend/package.json backend/package-lock.json; then
              backend_image=true
            fi
            if ! git diff --quiet "$BASE_SHA" HEAD -- \
              frontend/Dockerfile frontend/.dockerignore frontend/package.json frontend/package-lock.json; then
              frontend_image=true
            fi
            if ! git diff --quiet "$BASE_SHA" HEAD -- \
              docker-compose.prod.yml nginx.conf scripts/deploy.sh; then
              backend_image=true
              frontend_image=true
              compose=true
            fi
          fi

          echo "backend_image=$backend_image" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$frontend_image" >> "$GITHUB_OUTPUT"
          echo "compose=$compose" >> "$GITHUB_OUTPUT"

  quality:
    name: Lint & Shell Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install quality dependencies
        run: npm ci

      - name: Run static checks
        run: bash scripts/tests/test-static.sh

  backend:
    name: Backend — Typecheck, Migrate & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: myapp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Type check
        working-directory: backend
        run: npm run typecheck

      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/myapp_test
        run: npm run db:migrate

      - name: Validate migration checksums
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/myapp_test
        run: npm run db:status

      - name: Verify generated database types are committed
        run: git diff --exit-code -- backend/src/types/database.ts

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/myapp_test
          JWT_SECRET: ci-test-secret
          REFRESH_SECRET: ci-test-refresh-secret
          EMAIL_USER: test@example.com
          EMAIL_PASS: test
          EMAIL_FROM: test@example.com
          NODE_ENV: test
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend — Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build (includes tsc)
        working-directory: frontend
        run: npm run build

  production-compose:
    name: Production Compose Validation
    needs: [changes, quality]
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate production Compose configuration
        env:
          BACKEND_ENV_FILE: backend/.env.test
          DB_USER: test
          DB_PASSWORD: test
          DB_NAME: myapp_test
        run: docker compose -f docker-compose.prod.yml config --quiet

  production-backend-image:
    name: Backend Production Image
    needs: [changes, backend]
    if: needs.changes.outputs.backend_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build backend production image
        run: docker build --target prod backend

  production-frontend-image:
    name: Frontend Production Image
    needs: [changes, frontend]
    if: needs.changes.outputs.frontend_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build frontend/nginx production image
        run: docker build --tag be-original-frontend-ci frontend

      - name: Validate production nginx configuration
        run: |
          mkdir -p "$RUNNER_TEMP/letsencrypt/live/be-original.ca"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj /CN=be-original.ca \
            -keyout "$RUNNER_TEMP/letsencrypt/live/be-original.ca/privkey.pem" \
            -out "$RUNNER_TEMP/letsencrypt/live/be-original.ca/fullchain.pem"
          docker run --rm \
            --add-host backend:127.0.0.1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/nginx.conf,target=/etc/nginx/conf.d/default.conf,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/letsencrypt,target=/etc/letsencrypt,readonly" \
            be-original-frontend-ci nginx -t
