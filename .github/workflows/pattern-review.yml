name: Pattern Review

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      scope:
        description: Pattern review scope
        required: true
        default: changed
        type: choice
        options:
          - changed
          - full

permissions:
  contents: read

jobs:
  review:
    name: Review repository patterns
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Review changed patterns
        if: github.event_name == 'push' || inputs.scope == 'changed'
        env:
          CHECK_PATTERNS_BASE_REF: ${{ github.event_name == 'push' && github.event.before || 'HEAD^' }}
        run: node scripts/agents/check-patterns.js --changed

      - name: Review all patterns
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'full'
        run: node scripts/agents/check-patterns.js --all
