# Default local-development and test stack.
# Production deployments use docker-compose.prod.yml explicitly.

services:
  docs:
    image: node:24-alpine
    container_name: myapp_docs
    working_dir: /workspace/docs
    volumes:
      - ./:/workspace:ro
      - ./docs:/workspace/docs
      - docs_node_modules:/workspace/docs/node_modules
    tmpfs:
      - /workspace/docs/.astro
      - /workspace/docs/src/content/docs
    ports:
      - "127.0.0.1:4321:4321"
    command: sh -c "if [ ! -x node_modules/.bin/astro ]; then npm ci; fi; npm run dev -- --host 0.0.0.0"

  frontend:
    image: node:24-alpine
    container_name: myapp_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - ./tsconfig.base.json:/tsconfig.base.json:ro
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    stdin_open: true
    tty: true

  nginx:
    image: nginx:alpine
    container_name: myapp_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
    profiles:
      - production

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    container_name: myapp_backend
    working_dir: /app
    volumes:
      # Sync local code to container (live reload for development)
      - ./backend:/app
      - ./tsconfig.base.json:/tsconfig.base.json:ro
      # Persist node_modules in named volume (survives docker-compose down)
      - backend_node_modules:/app/node_modules
      # Keep uploads outside /app so Docker does not create a mount point in the host source tree
      - homepage_uploads:/uploads
    ports:
      - "5001:5001"
      - "9229:9229"  # Debug port
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DISABLE_2FA=true
      - DISABLE_OUTBOUND=true
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - UPLOAD_ROOT=/uploads
    depends_on:
      - db
    command: sh -c "npm install && npm run dev"

  db:
    image: postgres:18-alpine
    container_name: myapp_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      # Persist PostgreSQL data (survives docker-compose down)
      - db_data:/var/lib/postgresql

  db_test:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}_test
    ports:
      - "5433:5432"
    tmpfs:
      # In-memory storage — fast, ephemeral. Test data never persists to disk.
      - /var/lib/postgresql

volumes:
  # Named volumes persist data across container restarts/rebuilds
  db_data:  # PostgreSQL database files
  backend_node_modules:  # Node.js dependencies
  frontend_node_modules:  # Frontend dependencies
  docs_node_modules:  # Docs dependencies; independent of the web app
  homepage_uploads:  # Shared app uploads; legacy volume name retained to preserve existing files
